name: Hourly ingest

# Vercel Hobby only allows a daily cron, so GitHub runs the hourly one.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the ingest job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: ${{ vars.SITE_URL || 'https://www.specterpoint.online' }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o out.json -w "%{http_code}" --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/cron/ingest")
            cat out.json; echo
            if [ "$code" = "200" ] || [ "$code" = "207" ]; then exit 0; fi
            echo "attempt $attempt answered $code"; sleep 30
          done
          exit 1
